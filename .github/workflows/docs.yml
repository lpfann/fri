name: Test Documentation

on:
  push:
    branches:
      - 'master'
      - 'main'
      - 'dev'
  pull_request:
    branches:
      - 'master'
      - 'main'
      - 'dev'

permissions:
  contents: read

env:
  PYTHONVERSION: "3.12"

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
    #----------------------------------------------
    #       check-out repo and set-up python     
    #----------------------------------------------
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Set up Python ${{ env.PYTHONVERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHONVERSION }}
    #----------------------------------------------
    #  -----  install & configure poetry  -----      
    #----------------------------------------------
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true
        virtualenvs-path: .venv
        installer-parallel: true
    #----------------------------------------------
    #       load cached venv if cache exists      
    #----------------------------------------------
    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v4
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ env.PYTHONVERSION }}-${{ hashFiles('**/poetry.lock') }}
        restore-keys: |
          venv-${{ runner.os }}-${{ env.PYTHONVERSION }}-
    #----------------------------------------------
    # install dependencies if cache does not exist 
    #----------------------------------------------
    - name: Install dependencies
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      run: poetry install --no-interaction --no-root
    - name: Install root package
      run: poetry install --no-interaction
    - name: Run and convert notebooks into markdown
      run: poetry run jupyter nbconvert --to markdown docs/*.ipynb
    # Skip portray step temporarily due to pdocs compatibility issue
    # - name: Portray - Compile as HTML  
    #   run: poetry run portray as_html