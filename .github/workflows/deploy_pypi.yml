name: Deploy PyPi and Docs

on:
  release:
    types: [published, edited] # Only deploy when publishing github releases

permissions:
  contents: read
  pages: write
  id-token: write

env:
  PYTHONVERSION: "3.12"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fri
    steps:
    #----------------------------------------------
    #       check-out repo and set-up python     
    #----------------------------------------------
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up Python ${{ env.PYTHONVERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHONVERSION }}
    #----------------------------------------------
    #  -----  install & configure poetry  -----      
    #----------------------------------------------
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true
        virtualenvs-path: .venv
        installer-parallel: true
    #----------------------------------------------
    #       load cached venv if cache exists      
    #----------------------------------------------
    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v5
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ env.PYTHONVERSION }}-${{ hashFiles('**/poetry.lock') }}
        restore-keys: |
          venv-${{ runner.os }}-${{ env.PYTHONVERSION }}-
    - name: Set Poetry config
      run: |
        poetry config pypi-token.pypi ${{ secrets.POETRY_PYPI_TOKEN_PYPI }}
    #----------------------------------------------
    # install dependencies if cache does not exist 
    #----------------------------------------------
    - name: Install dependencies
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      run: poetry install --no-interaction --no-root
    - name: Install root package
      run: poetry install --no-interaction
    - name: Update version from release tag
      run: |
        # Extract version from GitHub release tag (remove 'v' prefix if present)
        VERSION=${GITHUB_REF#refs/tags/}
        VERSION=${VERSION#v}
        echo "Updating version to: $VERSION"
        poetry version $VERSION
        echo "Updated pyproject.toml version:"
        grep "version =" pyproject.toml
    - name: Deploy PyPi
      run: poetry publish --build -u __token__ -p ${{ secrets.POETRY_PYPI_TOKEN_PYPI }}
    - name: Run and convert notebooks into markdown
      run: poetry run jupyter nbconvert --to markdown docs/*.ipynb
    - name: Portray - Compile as HTML
      run: poetry run portray as_html
    - name: Deploy Docs to Github
      uses: peaceiris/actions-gh-pages@v4
      with:
        deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
        publish_branch: gh-pages
        publish_dir: ./site
        cname: fri.lpfann.me
